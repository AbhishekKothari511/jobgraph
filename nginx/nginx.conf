# Nginx load balancer — round-robin across 3 API instances
# Design: Nginx terminates HTTP connections and distributes load.
# The 3 api_N containers run the same Express app on the same port.
# Health checks use the /health endpoint we built in Phase 5.

upstream jobgraph_api {
    # Round-robin (default) — simplest, works well when all instances have equal capacity
    # Alternatives: least_conn (better for variable latency), ip_hash (sticky sessions)
    # We chose round-robin because the API is stateless; any request can go to any instance.
    server api_1:3001;
    server api_2:3001;
    server api_3:3001;

    keepalive 32;  # Keep 32 idle connections to each upstream — reduces TCP handshake overhead
}

server {
    listen 80;
    server_name _;

    # Timeouts
    proxy_connect_timeout  5s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Pass real client IP to Express (needed for rate limiter)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    location / {
        proxy_pass http://jobgraph_api;
    }

    # Health check for Nginx itself
    location /nginx-health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }
}
